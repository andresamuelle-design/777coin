<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>777 — The Lucky Protocol</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#050505;color:#fff;overflow-x:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(180,0,0,0.08) 0%,transparent 50%),radial-gradient(ellipse at 20% 80%,rgba(100,0,0,0.05) 0%,transparent 50%),#050505}
.wrap{position:relative;z-index:1;max-width:500px;margin:0 auto;padding:40px 24px;text-align:center}
.circle{width:140px;height:140px;border-radius:50%;margin:0 auto 32px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,60,60,0.2);background:rgba(255,30,30,0.03)}
.circle span{font-size:52px;font-weight:900;background:linear-gradient(135deg,#ff3333,#ff6600);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
h1{font-size:52px;font-weight:900;margin-bottom:4px;letter-spacing:-1px}
.sub{font-size:18px;color:rgba(255,255,255,0.4);font-weight:300;margin-bottom:4px}
.tkr{font-size:40px;font-weight:900;margin:12px 0 28px;background:linear-gradient(135deg,#ff3333,#ff6600);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
hr{width:40px;height:1.5px;margin:20px auto;background:linear-gradient(90deg,transparent,rgba(255,60,60,0.3),transparent);border:0}
.desc{color:rgba(255,255,255,0.5);line-height:1.8;font-size:14px;max-width:400px;margin:0 auto 32px}
.desc b{color:rgba(255,80,80,0.9);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:36px}
.stats div{text-align:center}
.stats .n{font-size:24px;font-weight:800;color:#ff3333}
.stats .l{font-size:11px;color:rgba(255,255,255,0.25);text-transform:uppercase;letter-spacing:2px;margin-top:4px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:36px}
.btn{padding:12px 28px;border-radius:100px;text-decoration:none;font-weight:600;font-size:14px;transition:.2s}
.btn-p{background:linear-gradient(135deg,#cc2222,#ff5500);color:#fff;box-shadow:0 4px 20px rgba(200,30,30,0.25)}
.btn-o{border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.6)}
.ca{padding:12px 16px;border:1px solid rgba(255,255,255,0.05);border-radius:10px;background:rgba(255,255,255,0.01);font-size:12px;word-break:break-all;margin-top:36px}
.ca-l{text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,0.15);font-size:10px;margin-bottom:4px}
.ca-v{font-family:monospace;font-size:12px;color:rgba(255,255,255,0.3)}
.ft{font-size:11px;color:rgba(255,255,255,0.1);margin-top:28px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
<div class="circle"><span>777</span></div>
<h1>777</h1>
<p class="sub">The Lucky Protocol</p>
<div class="tkr">$777</div>
<hr/>
<p class="desc">Three sevens. One destiny.<br/>Born from the belief that <b>luck favors the bold</b>.<br/>No roadmap. No promises. Just vibes.</p>
<div class="stats">
<div><div class="n">777M</div><div class="l">Supply</div></div>
<div><div class="n">0</div><div class="l">Tax</div></div>
<div><div class="n">SOL</div><div class="l">Chain</div></div>
</div>
<div class="btns">
<a class="btn btn-p" href="https://raydium.io/swap">Buy on Raydium</a>
<a class="btn btn-o" href="https://dexscreener.com/solana/TBA">Chart</a>
</div>
<div class="ca">
<div class="ca-l">Contract Address</div>
<div class="ca-v">TBA — Coming Soon</div>
</div>
<div class="ft">777 on Solana</div>
</div>
</body>
</html>
