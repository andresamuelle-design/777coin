<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>777 — The Lucky Protocol</title>
  <meta name="description" content="777 is a community-powered meme movement on Solana. Three sevens. One destiny." />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow-x: hidden;
    }

    /* ── BG Particles ── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(180, 0, 0, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 50%, rgba(180, 0, 0, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 0%, rgba(200, 50, 0, 0.06) 0%, transparent 40%);
    }

    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 60, 60, 0.4);
      border-radius: 50%;
      animation: float linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    .particle:nth-child(1) { left: 10%; animation-duration: 18s; animation-delay: 0s; width: 3px; height: 3px; }
    .particle:nth-child(2) { left: 25%; animation-duration: 22s; animation-delay: 2s; width: 5px; height: 5px; }
    .particle:nth-child(3) { left: 40%; animation-duration: 16s; animation-delay: 4s; width: 2px; height: 2px; }
    .particle:nth-child(4) { left: 55%; animation-duration: 20s; animation-delay: 1s; width: 4px; height: 4px; }
    .particle:nth-child(5) { left: 70%; animation-duration: 24s; animation-delay: 3s; width: 3px; height: 3px; }
    .particle:nth-child(6) { left: 85%; animation-duration: 19s; animation-delay: 5s; width: 5px; height: 5px; }
    .particle:nth-child(7) { left: 50%; animation-duration: 21s; animation-delay: 0s; width: 2px; height: 2px; }
    .particle:nth-child(8) { left: 15%; animation-duration: 17s; animation-delay: 6s; width: 4px; height: 4px; }
    .particle:nth-child(9) { left: 65%; animation-duration: 23s; animation-delay: 2s; width: 3px; height: 3px; }
    .particle:nth-child(10) { left: 35%; animation-duration: 15s; animation-delay: 7s; width: 5px; height: 5px; }

    /* ── Content ── */
    .container {
      position: relative;
      z-index: 1;
      max-width: 700px;
      margin: 0 auto;
      padding: 60px 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* ── Logo Circle ── */
    .logo-ring {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 2px solid rgba(200, 50, 50, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 40px;
      animation: pulse-ring 3s ease-in-out infinite;
    }

    .logo-ring::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px solid rgba(200, 50, 50, 0.1);
      animation: pulse-ring 3s ease-in-out infinite 1s;
    }

    .logo-ring::after {
      content: '';
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      border: 1px solid rgba(200, 50, 50, 0.05);
      animation: pulse-ring 3s ease-in-out infinite 2s;
    }

    @keyframes pulse-ring {
      0%, 100% { border-color: rgba(200, 50, 50, 0.3); }
      50% { border-color: rgba(200, 50, 50, 0.6); }
    }

    .logo-text {
      font-size: 72px;
      font-weight: 900;
      background: linear-gradient(135deg, #ff4444, #ff8800, #ff4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      letter-spacing: -2px;
      line-height: 1;
    }

    /* ── Hero ── */
    h1 {
      font-size: clamp(36px, 8vw, 64px);
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    .subtitle {
      font-size: clamp(16px, 3vw, 22px);
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 8px;
      font-weight: 300;
    }

    .ticker {
      font-size: 48px;
      font-weight: 900;
      background: linear-gradient(135deg, #ff4444, #ff8800);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 12px 0 32px;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(200, 50, 50, 0.5), transparent);
      margin: 24px auto;
    }

    /* ── Description ── */
    .desc {
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.8;
      font-size: 15px;
      max-width: 500px;
      margin: 0 auto 40px;
    }

    .desc span {
      color: rgba(255, 100, 100, 0.9);
    }

    /* ── Stats ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-bottom: 48px;
      width: 100%;
      max-width: 480px;
    }

    .stat {
      text-align: center;
    }

    .stat-num {
      font-size: 28px;
      font-weight: 800;
      color: #ff4444;
    }

    .stat-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 4px;
    }

    /* ── CTA ── */
    .cta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 48px;
    }

    .btn {
      padding: 14px 36px;
      border-radius: 100px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #cc2222, #ff6600);
      color: #fff;
      box-shadow: 0 4px 24px rgba(200, 30, 30, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(200, 30, 30, 0.4);
    }

    .btn-outline {
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.7);
    }

    .btn-outline:hover {
      border-color: rgba(255, 255, 255, 0.3);
      color: #fff;
    }

    /* ── Social ── */
    .social {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .social a {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.4);
      font-size: 14px;
      transition: all 0.2s;
    }

    .social a:hover {
      border-color: rgba(200, 50, 50, 0.4);
      color: #ff4444;
    }

    /* ── Footer ── */
    .ca {
      margin-top: 48px;
      padding: 12px 20px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      max-width: 100%;
      word-break: break-all;
    }

    .ca-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.2);
      margin-bottom: 6px;
    }

    .ca-address {
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
    }

    footer {
      margin-top: 40px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="container">
    <div class="logo-ring">
      <div class="logo-text">777</div>
    </div>

    <h1>777</h1>
    <p class="subtitle">The Lucky Protocol</p>
    <div class="ticker">$777</div>

    <div class="divider"></div>

    <p class="desc">
      Three sevens. One destiny.<br />
      Born from the belief that <span>luck favors the bold</span>.<br />
      No roadmap. No promises. Just vibes.
    </p>

    <div class="stats">
      <div class="stat">
        <div class="stat-num">777M</div>
        <div class="stat-label">Supply</div>
      </div>
      <div class="stat">
        <div class="stat-num">0</div>
        <div class="stat-label">Tax</div>
      </div>
      <div class="stat">
        <div class="stat-num">SOL</div>
        <div class="stat-label">Chain</div>
      </div>
    </div>

    <div class="cta">
      <a class="btn btn-primary" href="https://raydium.io/swap" target="_blank">Buy on Raydium</a>
      <a class="btn btn-outline" href="https://dexscreener.com/solana/TBA" target="_blank">Chart</a>
    </div>

    <div class="social">
      <a href="#" target="_blank" title="X">𝕏</a>
      <a href="#" target="_blank" title="Telegram">✈</a>
    </div>

    <div class="ca">
      <div class="ca-label">Contract Address</div>
      <div class="ca-address">TBA — Coming Soon</div>
    </div>

    <footer>777 on Solana</footer>
  </div>
</body>
</html>
